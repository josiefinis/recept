<!DOCTYPE html>


<html lang="sv">

    <head>
        <title>bara Pannkakor! &endash Skapa konto</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.bunny.net">
        <link href="https://fonts.bunny.net/css?family=josefin-sans:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i|twinkle-star:400" rel="stylesheet"/>
        <link rel="stylesheet" href="./styles/style.css">
    </head>

    <body>
        <div class="responsive-container">
            <a class="skip-link" href="#main">Till innehåll</a>
            <header class="banner">
                <nav>
                    <ul class="nav__list">
                        <li class="nav__item">
                            <a class="logo | link" aria-label="Gå till bara pannkakor startsidan" href="index.html">
                                <img class="logomark" src="images/logo-80.png" alt="bara pannkakor"><span class="logotype">bara Pannkakor!</span>
                            </a>
                        </li>
                        <li class="nav__item"><a class="link" href="recept.html">Recept</a></li>
                        <li class="nav__item"><a class="link" href="#">Forum</a></li>
                        <li class="nav__item"><a class="link" href="#">Om oss</a></li>
                        <li class="nav__item"><a class="link" href="log-in.html">Logga in</a></li>
                    </ul>
                </nav>
            </header>

            <main id="main">
                <div class="stack">
                    <h1>Logga in</h1>
                    <form action="#" method="post" class="form">
                        <div class="form-group">
                            <label for="username">Användarnamn</label>
                            <input type="text" id="username" name="username" required autocomplete="username">
                        </div>

                        <div class="form-group">
                            <label for="first-name">Lösenord</label>
                            <input type="text" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <div class="button">
                            <button type="submit">Logga in</button>
                        </div>
                    </form>
                    <a class="link" href="create-account.html">Create account</a>
                </div>
            </main>
        </div>
    </body>
</html>
